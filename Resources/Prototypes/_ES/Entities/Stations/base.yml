- type: entity
  id: ESBaseStationArrivals
  abstract: true
  components:
  - type: ESStationArrivals
    # <Whiskey> - o ônibus próprio do ES foi apagado porque citava 190
    # prototypes que nunca foram portados junto. Aponta para o ônibus padrão,
    # que carrega. Nenhuma estação do jogo herda daqui hoje.
    shuttlePath: /Maps/Shuttles/arrivals.yml
    # </Whiskey>

- type: entity
  id: ESBaseStationEvacuation
  abstract: true
  components:
  - type: StationEmergencyShuttle

- type: entity
  id: ESBaseStationTelesci
  abstract: true
  components:
  - type: ESTelesciStation
    stages:
    - announcement: es-telesci-announcement-stage-1
      announcementSound:
        path: /Audio/_ES/Announcements/attention_high.ogg
        params:
          volume: -4
      events:
        id: ESPortalEventAnomalies
        amount: 2
    - announcement: es-telesci-announcement-stage-2
      announcementSound:
        path: /Audio/_ES/Announcements/attention_high.ogg
        params:
          volume: -4
      events:
        id: ESPortalEventAnomalies
        amount: 3
    - announcement: es-telesci-announcement-stage-3
      announcementSound:
        path: /Audio/_ES/Announcements/attention_high.ogg
        params:
          volume: -4
      events:
        id: ESPortalEventAnomalies
        amount: 4
    - announcement: es-telesci-announcement-stage-4
      announcementSound:
        path: /Audio/_ES/Announcements/attention_high.ogg
        params:
          volume: -4

- type: entity
  id: ESBaseStationNeutral
  parent:
  - BaseStation
  - BaseStationNews
  - BaseStationCargo
  - BaseStationJobsSpawning
  - BaseStationRecords
  - BaseStationAlertLevels
  - BaseStationAllEventsEligible
  - BaseStationNanotrasen
  - BaseStationDeliveries
  - ESBaseStationArrivals
  - ESBaseStationTelesci
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: ESProducer
  - type: GridSpawn
    groups:
      trade: !type:GridSpawnGroup
        addComponents:
        - type: ProtectedGrid
        - type: TradeStation
        paths:
        - /Maps/Shuttles/trading_outpost.yml
