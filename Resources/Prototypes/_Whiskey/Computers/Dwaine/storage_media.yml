- type: entity
  parent: BaseItem
  id: WhiskeyDwaineHardDrive
  name: DWAINE hard drive
  description: A fixed high-capacity storage volume for a DWAINE mainframe.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: generic
  - type: DwaineStorageMedia
    kind: HardDrive
    label: hd0
    removable: false
    maxNodes: 8192
    maxDepth: 32
  - type: DwaineStorageMediaRuntime
  - type: DwaineBootMedia
    profile: whiskey-system-v1
  - type: DwaineDevice
    driverId: storage-media
    tag: storage
    displayName: fixed storage media
    capabilities: Inspect, Mount
    access: Authenticated

- type: entity
  parent: BaseItem
  id: WhiskeyDwaineRemovableDisk
  name: DWAINE removable disk
  description: A removable disk with a persistent, server-owned DWAINE volume.
  components:
  - type: Sprite
    sprite: Objects/Misc/cd.rsi
    state: icon
  - type: DwaineStorageMedia
    kind: RemovableDisk
    label: disk
    maxNodes: 2048
    maxDepth: 20
  - type: DwaineStorageMediaRuntime
  - type: DwaineDevice
    driverId: storage-media
    tag: storage
    displayName: removable storage disk
    capabilities: Inspect, Mount
    access: Authenticated

- type: entity
  parent: BaseItem
  id: WhiskeyDwaineReadOnlyDisk
  name: read-only DWAINE disk
  description: A write-protected removable DWAINE volume.
  components:
  - type: Sprite
    sprite: Objects/Misc/cd.rsi
    state: icon
  - type: DwaineStorageMedia
    kind: RemovableDisk
    label: readonly
    readOnly: true
    maxNodes: 2048
    maxDepth: 20
  - type: DwaineStorageMediaRuntime
  - type: DwaineDevice
    driverId: storage-media
    tag: storage
    displayName: read-only storage disk
    capabilities: Inspect, Mount
    access: Authenticated

- type: entity
  parent: BaseItem
  id: WhiskeyDwaineTape
  name: DWAINE data tape
  description: A removable tape-backed DWAINE volume intended for archives and transport.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: generic
  - type: DwaineStorageMedia
    kind: Tape
    label: tape
    maxNodes: 4096
    maxDepth: 24
    maxArchiveEntries: 2048
  - type: DwaineStorageMediaRuntime
  - type: DwaineDevice
    driverId: storage-media
    tag: storage
    displayName: data tape
    capabilities: Inspect, Mount
    access: Authenticated

- type: entity
  parent: WhiskeyDwaineTape
  id: WhiskeyDwaineRecoveryTape
  name: DWAINE recovery tape
  description: A data-only boot profile for recovering a DWAINE mainframe without executing host code.
  components:
  - type: DwaineStorageMedia
    kind: Tape
    label: recovery
    readOnly: true
    maxNodes: 4096
    maxDepth: 24
    maxArchiveEntries: 2048
  - type: DwaineBootMedia
    profile: whiskey-system-v1
