- type: entity
  parent: BaseComputer
  id: WhiskeyDwaineTerminal
  name: DWAINE terminal
  description: A server-driven terminal chassis awaiting a mainframe connection.
  components:
  - type: DwaineComputerHardware
    kind: Terminal
  - type: DwaineHardwareRuntime
  - type: DwaineTerminalLink
  - type: DwaineTerminal
    maxInputLength: 512
    outputLineLimit: 64
    outputCharacterLimit: 8192
  - type: DwaineDisplay
    columns: 80
    rows: 25
  - type: DwaineKeyboardInput
  - type: DwaineStorageConnector
    slotCount: 1
  - type: DwaineNetworkConnector
    networkId: station
    adapter: Radio
    tags:
    - terminal
    linkRange: 16
  - type: DwaineDeviceBusEndpoint
    busId: primary
    endpointLimit: 16
  - type: PowerSwitch
  - type: ActivatableUI
    key: enum.DwaineTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DwaineTerminalUiKey.Key:
        type: DwaineTerminalBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: BaseComputer
  id: WhiskeyDwaineMainframe
  name: DWAINE mainframe
  description: A high-capacity computer chassis for terminal sessions.
  components:
  - type: DwaineComputerHardware
    kind: Mainframe
  - type: DwaineHardwareRuntime
  - type: DwaineMainframe
    maxSessions: 32
    outputLineLimit: 128
    outputCharacterLimit: 16384
  - type: DwaineMainframeRuntime
  - type: DwaineKernel
    autoBoot: true
    requireStorageConnector: true
    requireBootMedia: true
    bootProfile: whiskey-system-v1
  - type: DwaineKernelRuntime
  - type: DwaineFileSystem
  - type: DwaineFileSystemRuntime
  - type: DwaineProcessScheduler
    maxProcesses: 256
    maxProcessesPerOwner: 32
    maxDispatchesPerUpdate: 64
    instructionsPerSlice: 1024
    instructionsPerProcess: 1000000
  - type: DwaineProcessRuntime
  - type: DwaineIdentity
    maxAccounts: 512
    maxGroups: 64
    maxSessions: 256
    sessionLifetimeSeconds: 3600
  - type: DwaineIdentityRuntime
  - type: DwaineShell
    maxInputLength: 2048
    maxTokens: 128
    maxPipelineStages: 8
    maxCommands: 32
    maxHistoryEntries: 64
    maxEnvironmentEntries: 64
    maxEnvironmentCharacters: 8192
    maxOutputCharacters: 16384
    maxEvaluationDepth: 4
    maxLoopIterations: 32
  - type: DwaineShellRuntime
  - type: VodkaRuntime
    maxInstructionsPerInvocation: 100000
    maxVariables: 512
    maxStringBytes: 16384
    maxDataBytes: 65536
    maxOutputBytes: 65536
    maxOperandStack: 1024
    maxCompatibilityStack: 512
    maxArguments: 32
    maxArgumentBytes: 16384
    maxCallDepth: 64
    logicalTimeoutSeconds: 30
  - type: VodkaRuntimeState
  - type: DwaineStorageConnector
    slotCount: 4
  - type: DwaineStorageDrive
    startingMedia:
    - WhiskeyDwaineHardDrive
  - type: DwaineStorageRuntime
  - type: DwaineNetworkConnector
    networkId: station
    adapter: Omni
    tags:
    - mainframe
    - dwaine
    linkRange: 16
  - type: DwaineNetworkEndpoint
    maxPayloadCharacters: 2048
    maxPendingRequests: 64
    maxDiscoveryResults: 64
    maxCaptureEntries: 128
    discoveryCooldownSeconds: 1
    requestTimeoutSeconds: 3
  - type: DwaineCommunicationService
    maxMessages: 512
    maxMessagesPerUser: 64
    maxMessageCharacters: 1024
  - type: DwaineCommunicationRuntime
  - type: DwaineDevice
    driverId: radio
    address: network0
    tag: network
    displayName: DWAINE network adapter
    capabilities: Inspect, Message
    access: Authenticated
  - type: DwaineDeviceBusEndpoint
    busId: primary
    endpointLimit: 64
  - type: DwaineDeviceAbi
    maxAttachedDevices: 128
    maxHandles: 512
    maxHandlesPerProcess: 32
    maxMessageCharacters: 2048
    scanCooldownSeconds: 1
  - type: DwaineDeviceAbiRuntime
  - type: DwaineSyscall
    maxArguments: 16
    maxArgumentCharacters: 8192
    maxResultCharacters: 16384
  - type: DwaineSyscallRuntime
  - type: DwaineServiceSuite
    maxMailMessages: 1024
    maxMailPerUser: 64
    maxLogEntries: 1024
  - type: DwaineServiceRuntime
  - type: DwaineStationServiceBridge
  - type: PowerSwitch

- type: entity
  parent: BaseHandheldComputer
  id: WhiskeyDwainePortableTerminal
  name: portable DWAINE terminal
  description: A battery-powered portable terminal using the same authoritative DWAINE transport.
  components:
  - type: Item
    sprite: Objects/Tools/handheld_mass_scanner.rsi
  - type: Sprite
    sprite: Objects/Tools/handheld_mass_scanner.rsi
    state: icon
  - type: DwaineComputerHardware
    kind: Terminal
    requiresExternalPower: false
  - type: DwaineHardwareRuntime
  - type: DwaineTerminalLink
  - type: DwaineTerminal
    maxInputLength: 512
    outputLineLimit: 64
    outputCharacterLimit: 8192
  - type: DwaineDisplay
    columns: 64
    rows: 20
  - type: DwaineKeyboardInput
  - type: DwaineNetworkConnector
    networkId: station
    adapter: Radio
    tags:
    - terminal
    - portable
    linkRange: 16
  - type: DwaineDeviceBusEndpoint
    busId: portable
    endpointLimit: 4
  - type: PowerCellDraw
    drawRate: 0.5
  - type: ActivatableUI
    key: enum.DwaineTerminalUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.DwaineTerminalUiKey.Key:
        type: DwaineTerminalBoundUserInterface

- type: entity
  parent: BaseComputer
  id: WhiskeyDwaineNetworkPrinter
  name: DWAINE network printer
  description: A capability-gated network printer for bounded text documents.
  components:
  - type: DwainePrinter
    maxDocumentCharacters: 4096
  - type: DwaineNetworkConnector
    networkId: station
    adapter: Radio
    tags:
    - device
    - printer
    linkRange: 16
  - type: DwaineNetworkEndpoint
  - type: DwaineDevice
    driverId: printer
    tag: printer
    displayName: DWAINE paper printer
    capabilities: Inspect, Message
    access: Authenticated

- type: entity
  parent: APCBasic
  id: WhiskeyDwaineNetworkApc
  name: DWAINE network APC
  description: An explicitly networked APC whose breaker is restricted to DWAINE operators.
  components:
  - type: DwaineApcInterface
  - type: DwaineNetworkConnector
    networkId: station
    adapter: Radio
    tags:
    - device
    - apc
    linkRange: 16
  - type: DwaineNetworkEndpoint
  - type: DwaineDevice
    driverId: apc
    tag: apc
    displayName: station APC interface
    capabilities: Inspect, Message
    access: Operator

- type: entity
  abstract: true
  id: WhiskeyDwaineComputerChassis
  components:
  - type: DwaineComputerHardware
  - type: DwaineHardwareRuntime
  - type: DwaineStorageConnector
  - type: DwaineNetworkConnector
  - type: DwaineDeviceBusEndpoint
