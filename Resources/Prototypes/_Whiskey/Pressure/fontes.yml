# As fontes de pressão mental. Cada uma é um tipo de coisa que pesa na cabeça
# de alguém, e o que a diferencia das outras não é só o peso: é o RITMO com que
# sai. Susto passa rápido, ter visto alguém morrer não.
#
# É essa diferença de ritmo que uma barra única não consegue representar, e é
# metade do motivo de este sistema existir.

- type: pressureSource
  id: WhiskeyPressaoMorte
  # Pesada e teimosa: entra forte e sai devagar. Ver alguém morrer é a coisa
  # mais pesada que acontece numa rodada normal.
  weight: 25
  cap: 60
  decay: 0.5
  description: pressure-source-morte
  # O canal desta fonte é a visão: quem acabou de ver alguém morrer fica olhando
  # para um ponto e perde o resto da sala.
  #
  # ATENÇÃO ao ler estes números: o decaimento é por CICLO, e não por segundo.
  # O ciclo é o DecayInterval do componente, que hoje são cinco segundos. Ou
  # seja 0,5 de decaimento não tira meio ponto por segundo, tira meio ponto a
  # cada cinco. Eu já errei essa conta uma vez e escrevi durações cinco vezes
  # menores do que as de verdade.
  #
  # Uma morte sozinha entra com 25 e não faz nada, de propósito: uma morte é
  # coisa de rodada normal. O primeiro degrau é 30, ou seja precisa de uma
  # segunda antes de a primeira sair, e a primeira sozinha leva pouco mais de
  # quatro minutos para sumir. Duas mortes na mesma cena é que apertam.
  #
  # O segundo degrau é 45 e não 50 porque duas mortes dão exatamente 50: no
  # limiar cravado o sintoma ligava e desligava no primeiro ciclo de
  # decaimento, ou seja piscava. Com 45 sobram 5 de folga.
  #
  # Em tempo de jogo, medido: quem viu duas mortes fica com a visão apertada
  # por volta de três minutos e meio e com a visão em túnel por volta de
  # cinquenta e cinco segundos. Quem chegou ao teto de 60 fica cinco minutos
  # com a visão apertada e dois minutos e meio com a em túnel.
  symptoms:
  - at: 30
    effect: StatusEffectVisaoApertada
  - at: 45
    effect: StatusEffectVisaoTunel

- type: pressureSource
  id: WhiskeyPressaoEscuro
  # Leve, constante e com teto baixo. O escuro incomoda e nunca vira trauma:
  # sem o teto por fonte, meia hora no escuro empataria com ter visto alguém
  # morrer, e a origem deixaria de significar coisa nenhuma.
  weight: 4
  cap: 20
  decay: 2
  description: pressure-source-escuro

- type: pressureSource
  id: WhiskeyPressaoDor
  # Média e rápida de sair, porque a dor passa quando o ferimento é tratado.
  weight: 12
  cap: 35
  decay: 3
  description: pressure-source-dor
  # O canal desta fonte é a fala, e não a visão nem o movimento.
  #
  # Fala porque é o único canal que os OUTROS percebem sem examinar: quem está
  # perto ouve a pessoa gaguejando e sabe que tem algo errado. Isso é o que o
  # sistema promete, estado mental com superfície social.
  #
  # E porque não atrapalha o que a pessoa está fazendo. Lentidão seria empilhar
  # em cima do que o dano já faz, e desajeitado tira o item da mão no meio de
  # uma cirurgia, que é exatamente o tipo de coisa que gera raiva em vez de
  # tensão.
  #
  # Uma pancada entra com 12 e não faz nada. Duas em sequência passam de 20,
  # e como esta fonte sai rápido, a 3 por segundo, precisa ser sequência mesmo.
  symptoms:
  - at: 20
    effect: StatusEffectStutter

- type: pressureSource
  id: WhiskeyPressaoSolidao
  # Fraca por vez e com teto alto: ficar sozinho não assusta, mas acumula.
  # É a única daqui que outro jogador resolve só de aparecer.
  weight: 3
  cap: 45
  decay: 1
  description: pressure-source-solidao
