# As quatro vozes já existem no repositório, vieram do Goobstation e têm
# atribuição em Audio/_Goobstation/Hallucinations/attributions.yml. A coleção
# própria existe para não pendurar um traço na bloodCrawl, que é do demônio.
- type: soundCollection
  id: WhiskeyAlucinacaoVozes
  files:
  - /Audio/_Goobstation/Hallucinations/behind_you1.ogg
  - /Audio/_Goobstation/Hallucinations/i_see_you1.ogg
  - /Audio/_Goobstation/Hallucinations/im_here1.ogg
  - /Audio/_Goobstation/Hallucinations/turn_around1.ogg

- type: localizedDataset
  id: WhiskeyAlucinacaoFrases
  values:
    prefix: hallucination-voice-
    count: 14

- type: moodCategory
  id: WhiskeyDepressao

- type: moodEffect
  id: WhiskeyDepressaoEpisodio
  category: WhiskeyDepressao
  moodChange: -18
  timeout: 180

- type: localizedDataset
  id: WhiskeyDepressaoPensamentos
  values:
    prefix: depression-thought-
    count: 20

- type: trait
  id: Schizophrenia
  name: trait-schizophrenia-name
  description: trait-schizophrenia-desc
  category: Disabilities
  components:
    - type: Hallucination
      sounds:
        collection: WhiskeyAlucinacaoVozes
      minTimeBetweenSounds: 40
      maxTimeBetweenSounds: 180
      maxSoundDistance: 6
      messages: WhiskeyAlucinacaoFrases
      minTimeBetweenMessages: 120
      maxTimeBetweenMessages: 420

- type: trait
  id: Depression
  name: trait-depression-name
  description: trait-depression-desc
  category: Disabilities
  components:
    - type: Mood
    - type: PeriodicMood
      effect: WhiskeyDepressaoEpisodio
      minTimeBetween: 240
      maxTimeBetween: 900
      messages: WhiskeyDepressaoPensamentos
      gainMessage: trait-depression-aviso

# ---------------------------------------------------------------------------
# Alegre, que é o `jolly` do /tg/station.
#
# É o espelho exato da depressão, e de propósito: no TG as duas quirks têm a
# mesma forma, um episódio que chega sozinho em hora imprevisível, com a mesma
# probabilidade por tique. Muda o sinal e o peso.
#
# Por isso este traço não precisou de código nenhum: o PeriodicMood já fazia
# tudo o que ele exige. Ele existe aqui como prova de que aquele motor não é
# "o sistema da depressão", é um relógio genérico de episódio de humor.
#
# Números do TG, em code/datums/mood_events/generic_positive_events.dm:
# mood_change 6 e timeout de 2 minutos. Com 6, o humor vai a 56, que é a faixa
# Ótimo. A frequência lá é de 15 por hora, ou seja um a cada 240 segundos em
# média, que é o que o intervalo de 150 a 330 dá aqui.
# ---------------------------------------------------------------------------
- type: moodCategory
  id: WhiskeyAlegria

# A duração precisa ser MENOR que o menor intervalo entre episódios. Sendo da
# mesma categoria, um episódio novo substitui o anterior e reinicia o relógio,
# e com duração maior o humor ficaria preso lá em cima para sempre. Com 120
# contra um mínimo de 150, sobra pelo menos meio minuto de respiro.
- type: moodEffect
  id: WhiskeyAlegriaEpisodio
  category: WhiskeyAlegria
  moodChange: 6
  timeout: 120

- type: localizedDataset
  id: WhiskeyAlegriaPensamentos
  values:
    prefix: jolly-thought-
    count: 16

- type: trait
  id: Jolly
  name: trait-jolly-name
  description: trait-jolly-desc
  category: Quirks
  components:
    - type: Mood
    - type: PeriodicMood
      effect: WhiskeyAlegriaEpisodio
      minTimeBetween: 150
      maxTimeBetween: 330
      messages: WhiskeyAlegriaPensamentos
      # Verde acinzentado, para o pensamento bom não se confundir com o roxo
      # da depressão nem com comunicado da estação.
      messageColor: "#8CA88C"
