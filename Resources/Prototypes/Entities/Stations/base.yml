- type: entity
  id: BaseStation
  abstract: true
  components:
    - type: StationData

- type: entity
  id: BaseStationCargo
  abstract: true
  components:
    - type: StationBankAccount
      primaryCut: 0.9 # Trauma
    # <Whiskey>
    - type: Payroll
      # A régua: a rodada tem 90 minutos e o salário cai a cada 5, então são 18
      # pagamentos. Com o padrão de 40, um cargo comum termina a rodada com 720
      # spesos, e o item mais caro da Loja Geral custa 250. Dinheiro que compra
      # a prateleira inteira deixa de ser escolha.
      #
      # Quem não está aqui recebe o padrão. Silício e Comando Central não
      # recebem nada, porque cyborg não usa cartão e Central não é da estação.
      defaultSalary: 40
      salaries:
        # Capitão responde pela estação inteira.
        Captain: 100

        # Chefes de setor. Recebem mais e ainda decidem o orçamento de onde sai
        # o salário de quem trabalha com eles.
        ChiefEngineer: 70
        ChiefMedicalOfficer: 70
        HeadOfPersonnel: 70
        HeadOfSecurity: 70
        ResearchDirector: 70
        Quartermaster: 70

        # Quem está aprendendo, e quem entrou sem função fixa.
        TechnicalAssistant: 25
        MedicalIntern: 25
        ResearchAssistant: 25
        SecurityCadet: 25
        Passenger: 25
        Visitor: 25
    - type: SalesCommission
    # </Whiskey>
    - type: StationCargoOrderDatabase
      orders:
        Cargo: [ ]
        Engineering: [ ]
        Medical: [ ]
        Science: [ ]
        Security: [ ]
        Service: [ ]
    - type: StationCargoBountyDatabase
    - type: StationXenobiologyBountyDatabase # Goobstaton

- type: entity
  id: BaseStationJobsSpawning
  abstract: true
  components:
    - type: StationJobs
      availableJobs: {}
    - type: StationSpawning

- type: entity
  id: BaseStationRecords
  abstract: true
  components:
    - type: StationRecords

- type: entity
  id: BaseStationArrivals
  abstract: true
  components:
    - type: StationArrivals

- type: entity
  id: BaseStationShuttles
  abstract: true
  components:
    - type: StationCargoShuttle
      path: /Maps/_Trauma/Shuttles/cargo.yml # Trauma
    - type: GridSpawn
      groups:
        # <Trauma>
        mining: !type:GridSpawnGroup
          paths:
          - /Maps/_Trauma/Shuttles/mining.yml
        # <Trauma>
        trade: !type:GridSpawnGroup
          addComponents:
            - type: ProtectedGrid
            - type: TradeStation
          paths:
            - /Maps/_Trauma/Shuttles/trading_outpost.yml # Trauma
          nameDataset: TradeStationNames
        # <Trauma>
        vgroid: !type:DungeonSpawnGroup # Trauma, made this spawn first
          hide: false
          nameGrid: true
          minimumDistance: 400 # Was 300
          maximumDistance: 600 # Was 350
          nameDataset: NamesBorer
          stationGrid: false
          addComponents:
          - type: Gravity
            enabled: true
            inherent: true
          - type: IFF
            color: "#d67e27"
          protos:
          - VGRoid
        # </Trauma>
        # Spawn last
        ruins: !type:GridSpawnGroup
          hide: false
          nameGrid: false
          minCount: 3 # Trauma, was 2
          maxCount: 5 # Trauma, was 2
          minimumDistance: 200 # Trauma, was 100
          maximumDistance: 300 # Trauma, was 300
          stationGrid: false
          paths:
          - /Maps/Ruins/abandoned_outpost.yml
          - /Maps/Ruins/atmos_interchange.yml
          - /Maps/Ruins/chunked_tcomms.yml
          - /Maps/Ruins/biodome_satellite.yml
          - /Maps/Ruins/derelict.yml
          - /Maps/_Goobstation/Ruins/goobdjstation.yml # goob - this was so fucking bad
          - /Maps/Ruins/empty_flagship.yml
          - /Maps/Ruins/hydro_outpost.yml
          - /Maps/Ruins/old_ai_sat.yml
          - /Maps/Ruins/ruined_prison_ship.yml
          - /Maps/Ruins/syndicate_dropship.yml
          - /Maps/Ruins/whiteship_ancient.yml
          - /Maps/Ruins/whiteship_bluespacejumper.yml
          - /Maps/Ruins/wrecklaimer.yml
          - /Maps/Ruins/displaced_telescience.yml
          addComponents:
          - type: Gravity
            enabled: true
            inherent: true
          - type: IFF
            color: "#b14918"
        wrecks: !type:DungeonSpawnGroup
          hide: true
          nameGrid: false
          minimumDistance: 100 # Trauma, was 150
          maximumDistance: 200 # Trauma, was 300
          stationGrid: false
          minCount: 10 # Trauma, was 12 make 32 when grid bug fixed
          maxCount: 10 # Trauma. was 16 make 64 when grid bug fixed
          addComponents:
          - type: IFF
            flags: HideLabel
            color: "#88b0d1"
          protos:
          - ChunkDebrisSmall
          - ChunkDebrisSmall
          - ChunkDebrisSmall
          - ChunkDebrisSmall
          - ChunkDebris

