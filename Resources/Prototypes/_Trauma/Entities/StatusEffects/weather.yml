- type: entity
  parent: WeatherSnowfallHeavy
  id: WeatherSnowfallMagic
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_Trauma/Effects/weather.rsi
      state: snowfall_magic
    sound:
      path: /Audio/Effects/Weather/snowstorm.ogg
      params:
        loop: true
        volume: -20 # much quieter

- type: entity
  parent: WeatherFallout
  id: WeatherRadiationStorm
  components:
  # <Whiskey> - o alarme NÃO vai aqui, e isso custou um teste em jogo para
  # descobrir. O som do WeatherStatusEffect é ambiental: o cliente procura, num
  # raio de três tiles, um tile por onde o clima entra, e se não achar nenhum
  # joga a oclusão para 3, que abafa quase tudo. Ele existe para a pessoa ouvir
  # a tempestade lá fora através do casco. Dentro da estação some, mesmo com o
  # dano acontecendo, porque o dano ignora teto e o som não.
  #
  # Alarme de estação precisa ser global. Ele está no estágio do agendador,
  # logo abaixo, junto da mensagem que já era global.
  - type: WeatherEffects
    conditions:
    - !type:WhitelistCondition
      blacklist:
        components:
        - RadStormImmune
    effects:
    - !type:HealthChange
      ignoreResistances: false
      splitDamage: None
      damage:
        types:
          Radiation: 0.25
    - !type:RandomNegativeMutation
      probability: 0.1 # average 10s of exposure per mutation
    safeIndoors: false # entire station is indoors...
    safeAreas:
    - AreaAiUpload
    # TODO: make AI access area and replace the not really AI sat places with that, then add AreaAi here
    - AreaMaints
    - AreaSubstation
    - AreaRadstorm
    - AreaLootRoom
    - AreaPrisonShower # not quite toilet
    - AreaToilet
    - AreaShuttleAbductor
    - AreaShuttleNukie

# Schedulers

- type: entity
  abstract: true
  parent: StatusEffectBase
  id: BaseWeatherScheduler
  components:
  - type: WeatherScheduler
  - type: StatusEffect
    whitelist:
      components:
      - Map

- type: entity
  parent: BaseWeatherScheduler
  id: WeatherSchedulerAshStorm
  components:
  - type: WeatherScheduler
    stages:
    - duration: # 10-15 minutes of calm
        min: 600
        max: 900
    - weather: WeatherAshfallLight
      message: ash-storm-telegraph
      duration:
        min: 90
        max: 120
    - weather: WeatherAshfall
      message: ash-storm-alert
      duration:
        min: 120
        max: 180
    - weather: WeatherAshfallLight
      message: ash-storm-clearing
      duration:
        min: 30
        max: 30

- type: entity
  parent: BaseWeatherScheduler
  id: WeatherSchedulerRadiationStorm
  components:
  - type: WeatherScheduler
    temporary: true # it's a station event and has no rest period
    stages:
    - weather: WeatherFallout
      message: radiation-storm-telegraph
      duration:
        min: 40
        max: 40
    - weather: WeatherRadiationStorm
      message: radiation-storm-alert
      # <Whiskey> - alarme nuclear pedido pela host, global para alcançar quem
      # está no fundo da estação.
      #
      # NÃO usar o /Audio/Machines/Nuke/nuke_alarm.ogg, que seria o literal:
      # ele é o alarme da bomba armada, em NukeComponent.AlertSound, e emprestar
      # esse som faz quem ouve achar que a estação vai explodir.
      #
      # O meltdown_siren da mesma pasta serviria pelo som, mas é
      # CC-BY-NC-SA-3.0, e non commercial não combina com o AGPL daqui.
      # Um toque só, no começo da tempestade, e não em laço. O arquivo tem 4,2
      # segundos e a tempestade fica 40 no ar: alarme estridente repetindo dez
      # vezes vira tortura, e no teste em jogo já ficou irritante demais no
      # volume cheio. O papel dele é fazer a pessoa levantar da cadeira, não
      # acompanhar o evento inteiro.
      sound:
        path: /Audio/_FarHorizons/Machines/reactor_alarm_3.ogg
        params:
          volume: -8
      # </Whiskey>
      duration: # 1-2.5 mins
        min: 60
        max: 150
    - weather: WeatherFallout
      message: radiation-storm-clearing
      duration:
        min: 10
        max: 10
    # <Whiskey> - o /tg/station avisa quando a ameaça passa, e aqui não avisava.
    # Sem clima, é só o recado de que dá para sair do abrigo. Um estágio sem
    # weather nenhum encerra o agendador logo em seguida, porque ele é temporary.
    - message: radiation-storm-over
      duration:
        min: 1
        max: 1
    # </Whiskey>
