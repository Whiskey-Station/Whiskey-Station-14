- type: entity
  abstract: true
  parent: BaseItem
  id: TraumaPlayingCardBase
  name: Playing card
  description: A standard playing card.
  categories: [ HideSpawnMenu ]
  components:
  - type: PlayingCard
  - type: Sprite
    sprite: _Trauma/Objects/Fun/playing_cards.rsi
    state: spades_ace
  - type: Item
    size: Tiny

# Individual card (spawned from deck)
- type: entity
  parent: TraumaPlayingCardBase
  id: TraumaPlayingCard
  categories: [ HideSpawnMenu ]

# Hand of cards
- type: entity
  parent: BaseItem
  id: TraumaPlayingCardHand
  name: Hand of cards
  description: A hand of playing cards.
  categories: [ HideSpawnMenu ]
  components:
  - type: PlayingCardHand
  - type: Sprite
    sprite: _Trauma/Objects/Fun/playing_cards.rsi
    state: back_deck
  - type: Item
  - type: UseDelay
    delay: 0.1
  - type: UserInterface
    interfaces:
      enum.PlayingCardHandUi.Key:
        type: PlayingCardHandBui

# Deck of cards
- type: entity
  parent: BaseItem
  id: TraumaPlayingCardDeck
  name: Deck of cards
  suffix: Trauma
  description: A standard deck of 52 playing cards.
  components:
  - type: PlayingCardDeck
    cardPrototype: TraumaPlayingCard
  - type: Sprite
    sprite: _Trauma/Objects/Fun/playing_cards.rsi
    state: deck
  - type: Item
  - type: UseDelay
    delay: 0.1
