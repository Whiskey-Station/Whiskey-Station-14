# <Whiskey> - as entradas "- Insurgent" deste arquivo estão comentadas.
#
# A Whiskey tirou a hostilidade automática contra insurgentes no commit
# f7a66cb2fb, porque insurgente ser atacado por todo bicho, robô e tripulante
# assim que pisa na estação acaba com o disfarce antes de qualquer jogador
# perceber quem ele é. Quem reage sozinho é a torreta anti-insurgente.
#
# O upstream trouxe isso de volta por um caminho novo: as facções migraram para
# Partials, e as entradas vieram junto. O arquivo em conflito estava certo, e a
# regressão entrou por este arquivo, que chegou SEM conflito nenhum.
#
# Tentei desfazer com um partial nosso usando !Remove, e não funciona: partial
# sobre partial não empilha, medido com o InsurgentFactionTest. Por isso a
# remoção fica aqui, comentada em vez de apagada, para o próximo upstream
# mostrar o conflito na linha certa em vez de reintroduzir calado.
# </Whiskey>

# SPDX-License-Identifier: AGPL-3.0-or-later

- type: npcFaction
  id: Dragon
  hostile:
