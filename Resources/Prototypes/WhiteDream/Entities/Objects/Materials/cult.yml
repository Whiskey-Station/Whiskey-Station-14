- type: entity
  parent: SheetOtherBase
  id: RunedMetal
  name: runic metal
  description: An unusual sheet of metal with a pulsating rune.
  suffix: Full
  components:
  - type: Sprite
    sprite: _Whiskey/BloodCult/Sheets/metal.rsi # Whiskey
    layers:
    - state: runedmetal_3 # Whiskey
      map: [ "base" ]
  - type: Tag
    tags:
    - Sheet
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      RunedMetal: 100
  - type: Stack
    stackType: RunedMetalSheets
    baseLayer: base
    layerStates:
    - runedmetal # Whiskey
    - runedmetal_2 # Whiskey
    - runedmetal_3 # Whiskey
  - type: Appearance
  - type: Item
    size: Small
    sprite: _Whiskey/BloodCult/Sheets/metal.rsi # Whiskey
    heldPrefix: runedmetal # Whiskey
  - type: CultItem
  - type: UserInterface
    interfaces:
      enum.BloodCultConstructionUiKey.Key:
        type: BloodCultConstructionMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.BloodCultConstructionUiKey.Key
  - type: BloodCultConstruction
    entries:
    - prototype: CultPylon
    - prototype: CultFactoryArchives
    - prototype: CultFactoryForge
    - prototype: CultFactoryAltar
    - prototype: CultGirder
    - prototype: CultDoor

