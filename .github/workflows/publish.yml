name: Publish

concurrency:
  group: publish-2
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
   - cron: '0 10 */2 * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml nasm # Trauma - build the Hidden Operative native runtime.

    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging --configuration Release --no-build -- server --configuration Release --platform win-x64 --platform linux-x64

    - name: Prove client guard rejects the custom server engine
      run: |
        if dotnet run --project Content.Packaging --configuration Release --no-build -- client --skip-build --no-wipe-release > launcher-engine-guard.log 2>&1; then
          echo "Client packaging unexpectedly accepted the custom server engine" >&2
          exit 1
        fi
        grep -F "LAUNCHER_ENGINE_GUARD: refusing to package SS14.Client.zip" launcher-engine-guard.log
        grep -F "launcher engine commit mismatch" launcher-engine-guard.log

    - name: Switch to client engine
      run: |
        python3 Tools/launcher_engine.py clone RobustToolbox.launcher
        mv RobustToolbox RobustToolbox.server
        mv RobustToolbox.launcher RobustToolbox
        python3 Tools/launcher_engine.py verify RobustToolbox

    - name: Rebuild packaging for launcher engine
      run: |
        dotnet restore
        dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package client
      run: dotnet run --project Content.Packaging --configuration Release --no-build -- client --configuration Release --no-wipe-release

    # Guarda os pacotes antes de tentar publicar. O passo de publicação aponta
    # para o CDN do Trauma e não tem token aqui, e quando ele falha o job morre
    # levando os zips junto, porque eles só existem no runner. Subindo antes,
    # dá para baixar e aplicar à mão mesmo que a publicação continue falhando.
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: pacotes-${{ github.sha }}
        path: release/
        retention-days: 7
        compression-level: 0

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (Discord)
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}

    - name: Publish changelog (RSS)
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
