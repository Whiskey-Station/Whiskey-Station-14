name: Publish

concurrency:
  group: publish-2
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
   - cron: '0 10 */2 * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml nasm # Trauma - build the Hidden Operative native runtime.

    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Get Engine Tag
      run: |
        # <Whiskey> - mantido contra o upstream de propósito, e não é teimosia.
        # O Trauma resolve a tag com git describe --tags, que devolve a tag mais
        # próxima no histórico do submódulo e não a versão que o engine declara.
        # Foi isso que fez o Hub anunciar rt 288 rodando 289, e o conserto está
        # no commit 2ea1a7103c de 29/08.
        #
        # Ler o Robust.Engine.Version.props devolve a versão de verdade, e o
        # ls-remote confere que a tag existe no RobustToolbox oficial, que é a
        # mesma garantia que o fetch wizden do lado deles queria dar, sem
        # precisar baixar nada.
        ENGINE_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' RobustToolbox/MSBuild/Robust.Engine.Version.props)
        ENGINE_TAG="v${ENGINE_VERSION}"
        git ls-remote --exit-code --tags https://github.com/space-wizards/RobustToolbox.git "refs/tags/${ENGINE_TAG}"
        echo "ENGINE_TAG=${ENGINE_TAG}" >> "$GITHUB_ENV"
        # </Whiskey>

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64

    - name: Switch to client engine
      # never compile our shared engine code, it may have changed ABI so client would break
      # only networking has to stay identical
      run: |
        rm -rf RobustToolbox
        git clone --recursive https://github.com/space-wizards/RobustToolbox -b "$ENGINE_TAG"

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    # Guarda os pacotes antes de tentar publicar. O passo de publicação aponta
    # para o CDN do Trauma e não tem token aqui, e quando ele falha o job morre
    # levando os zips junto, porque eles só existem no runner. Subindo antes,
    # dá para baixar e aplicar à mão mesmo que a publicação continue falhando.
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: pacotes-${{ github.sha }}
        path: release/
        retention-days: 7
        compression-level: 0

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (Discord)
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}

    - name: Publish changelog (RSS)
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
